apiVersion: apps/v1
kind: Deployment
metadata:
  name: sound-scout-backend
  namespace: default
  labels:
    app: sound-scout-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sound-scout-backend
  template:
    metadata:
      labels:
        app: sound-scout-backend
    spec:
      containers:
        - name: backend
          image: asia-southeast1-docker.pkg.dev/sound-scout-prod-001/sound-scout-repo/sound-scout-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: sound-scout-config
                  key: BACKEND_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sound-scout-secrets
                  key: DATABASE_URL
            - name: WHATSAPP_WORKER_URL
              valueFrom:
                configMapKeyRef:
                  name: sound-scout-config
                  key: WHATSAPP_WORKER_URL
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: sound-scout-config
                  key: AI_SERVICE_URL
            - name: WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sound-scout-secrets
                  key: WORKER_SECRET
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: sound-scout-backend
  namespace: default
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "sound-scout-long-timeout"}'
spec:
  selector:
    app: sound-scout-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
