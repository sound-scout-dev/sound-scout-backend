apiVersion: apps/v1
kind: Deployment
metadata:
  name: sound-scout-ai
  namespace: default
  labels:
    app: sound-scout-ai
spec:
  # Was 1 -- a single pod meant any crash/OOM/restart took the whole AI feature down with
  # no fallback (this is very likely what caused the intermittent pitch-demo failure).
  # LangGraph calls are stateless per-request (no session affinity, unlike the WhatsApp
  # worker), so running 2 replicas behind the existing ClusterIP Service is a safe way to
  # remove that single point of failure -- request footprint only grows by 100m CPU / 300Mi.
  replicas: 2
  selector:
    matchLabels:
      app: sound-scout-ai
  template:
    metadata:
      labels:
        app: sound-scout-ai
    spec:
      containers:
        - name: ai-service
          image: asia-southeast1-docker.pkg.dev/sound-scout-prod-001/sound-scout-repo/sound-scout-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: sound-scout-config
                  key: AI_PORT
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sound-scout-secrets
                  key: GEMINI_API_KEY
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "300Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: sound-scout-ai
  namespace: default
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "sound-scout-long-timeout"}'
spec:
  selector:
    app: sound-scout-ai
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
